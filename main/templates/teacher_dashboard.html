<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Teacher Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #C1C8E4;
        }

        .top-bar {
            background: #5680E9;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #84CEEB;
        }

        input[type="number"] {
            width: 60px;
            padding: 5px;
            text-align: center;
        }

        .save-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #5680E9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #4263B2;
        }
    </style>
</head>

<body>

<div class="top-bar">
    <h1>Teacher Dashboard</h1>
</div>

<div class="container">

<form method="post">
    {% csrf_token %}

    <table>
        <tr>
            <th>Учень</th>
            {% for subject in subjects %}
                <th>{{ subject.title }}</th>
            {% endfor %}
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student.first_name }} {{ student.last_name }}</td>

            {% for subject in subjects %}
            <td>
                <input
                    type="number"
                    name="grade_{{ student.id }}_{{ subject.id }}"
                    min="1"
                    max="12"
                    value="{% for grade in grades %}
                               {% if grade.student.id == student.id and grade.subject.id == subject.id %}
                                   {{ grade.value }}
                               {% endif %}
                           {% endfor %}"
                >
            </td>
            {% endfor %}
        </tr>
        {% endfor %}
    </table>

    <button type="submit" class="save-btn">Зберегти оцінки</button>
</form>

</div>

</body>
</html>
